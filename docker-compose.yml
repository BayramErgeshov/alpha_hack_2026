# One command for the jury: docker compose up --build  ->  http://127.0.0.1:8080
services:
  alpha-backend:
    build: .
    ports:
      - "127.0.0.1:${ALFA_PORT:-8080}:8080"
    environment:
      ALFA_API_TOKEN: ${ALFA_API_TOKEN:-}
      ALFA_LLM_API_KEY: ${ALFA_LLM_API_KEY:-}
      ALFA_LLM_BASE_URL: ${ALFA_LLM_BASE_URL:-https://changellenge.up.railway.app/v1}
      ALFA_LLM_MODEL: ${ALFA_LLM_MODEL:-deepseek/deepseek-v4.1-flash}
      ALFA_LLM_MODEL_FAST: ${ALFA_LLM_MODEL_FAST:-google/gemma-4-26b-a4b-it}
      ALFA_LLM_MODEL_REVIEW: ${ALFA_LLM_MODEL_REVIEW:-z-ai/glm-5.3-flash}
      ALFA_LLM_TIMEOUT_SECONDS: ${ALFA_LLM_TIMEOUT_SECONDS:-35}
      ALFA_LLM_DAILY_TOKEN_LIMIT: ${ALFA_LLM_DAILY_TOKEN_LIMIT:-400000}
      ALFA_AGENT_SELF_CHECK: ${ALFA_AGENT_SELF_CHECK:-1}
      ALFA_NEWS_REFRESH_MINUTES: ${ALFA_NEWS_REFRESH_MINUTES:-30}
      ALFA_CORS_ORIGIN: ${ALFA_CORS_ORIGIN:-}
    volumes:
      - alpha-work:/app/work
    restart: unless-stopped
  # Optional public link for a live demo from this computer (no account needed):
  #   docker compose --profile public up -d   ->  https://<random>.trycloudflare.com (see start-public.cmd)
  # The link works while this computer and Docker are running; the model budget is capped by
  # ALFA_LLM_DAILY_TOKEN_LIMIT, and the key never leaves the backend container.
  public-link:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["public"]
    # http2 over TCP 443: QUIC (UDP 7844) is blocked on many networks, incl. the dev machine
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://alpha-backend:8080"]
    depends_on:
      - alpha-backend
    restart: unless-stopped
volumes:
  alpha-work:
