openapi: 3.1.0
info:
  title: Alpha News Analytics Backend
  version: 2.0.0
  description: >-
    C++ backend for page parsing, company profiles and personalized insights.
    Authentication is enforced only when ALFA_API_TOKEN is configured; /health is public.
    Requests are synchronous. A 200 insight can use deterministic_fallback instead of an LLM.
    Limits on text fields are UTF-8 byte limits, not Unicode character counts.
    Field contracts: docs/FRONTEND_API.md; real response examples: docs/examples/v2-*.json.
servers:
  - url: http://127.0.0.1:8080
security:
  - ApiKeyAuth: []
  - HeaderToken: []
paths:
  /health:
    get:
      security: []
      summary: Service health
      responses:
        '200':
          description: Service is running
  /api/v1/models:
    get:
      summary: List case-allowed models
      responses:
        '200':
          description: Model list and whether an API key is configured
  /api/v1/companies:
    get:
      summary: Search company profiles
      parameters:
        - in: query
          name: q
          required: true
          description: Exact case-insensitive synthetic company identifier or exact OKVED code; no name or substring search.
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200': { description: Matching profiles }
        '400': { description: Missing query }
  /api/v1/companies/{company_id}:
    get:
      summary: Get a company profile
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200': { description: Company profile }
        '404': { description: Company not found }
  /api/v1/companies/{company_id}/network:
    get:
      summary: Get aggregated payment network
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200': { description: Payment network aggregates }
        '404': { description: Company not found }
  /api/v1/analytics/search:
    get:
      summary: Search bank analytical materials
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200': { description: Ranked passages with document name, source page and text_extraction provenance }
  /api/v1/parse:
    post:
      summary: Parse a public web page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: Public HTTP(S) URL; at most 4096 UTF-8 bytes. }
                mode: { type: string, enum: [jina, raw], default: jina }
      responses:
        '200': { description: Jina-style markdown plus extracted metadata }
        '400': { description: Invalid JSON or missing URL }
        '401': { description: Missing or invalid API token when configured }
        '422': { description: Page could not be parsed or URL was rejected }
  /api/v1/clients:
    get:
      summary: Large clients (revenue >= 15 bn RUB by default), sorted by revenue
      parameters:
        - { in: query, name: q, schema: { type: string }, description: Exact id, OKVED prefix, or text in industry/city }
        - { in: query, name: industry, schema: { type: string } }
        - { in: query, name: region, schema: { type: string } }
        - { in: query, name: min_revenue, schema: { type: number, default: 15000000000 } }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 200 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        '200': { description: '{total, limit, offset, items[{id, industry, okved_code, region, city, revenue_rub, client_type, products[], group_size, foreign_trade}]}' }
  /api/v1/clients/facets:
    get:
      summary: Top industries and regions among large clients
      responses:
        '200': { description: '{industries[{name,count}], regions[{name,count}]}' }
  /api/v1/roles:
    get:
      summary: User roles that change feed priorities and analysis focus
      responses:
        '200': { description: '{items[{id, title, focus, priority_topics[]}]}' }
  /api/v1/news:
    get:
      summary: Stored news, newest first
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        '200': { description: '{total, items[{id, title, summary, url, source, published, categories[], category_labels[], duplicates[]}]}' }
  /api/v1/news/refresh:
    post:
      summary: Collect RSS feeds now
      responses:
        '200': { description: '{sources[{source, ok, parsed, added, error}], added, total}' }
  /api/v1/companies/{company_id}/feed:
    get:
      summary: Personal news feed for a company and a user role
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - { in: query, name: role, schema: { type: string, enum: [owner, ceo, cfo, treasurer, accountant], default: ceo } }
        - { in: query, name: limit, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: '{company_id, role, counterparty_industries[], data_gaps[], items[{news_id, title, url, source, published, why_for_you, relevance, bank_hint, categories[], duplicates[], also_reported[{news_id, source, title, url}] — retellings of the same event by other outlets}]}' }
        '400': { description: Invalid company id or unknown role }
        '404': { description: Company not found }
  /api/v1/feedback:
    post:
      summary: Rate an insight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [insight_id, useful]
              properties:
                insight_id: { type: string }
                useful: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Recorded }
        '400': { description: Missing insight_id or useful }
        '404': { description: Insight not found }
  /api/v1/metrics:
    get:
      summary: Quality metrics, user feedback and token budget
      responses:
        '200': { description: '{insights, quality, feedback, latency, budget, definitions}' }
  /api/v1/insights:
    post:
      summary: Analyze news for a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id]
              anyOf:
                - required: [news_id]
                  properties:
                    news_id: { type: string, description: Id from /api/v1/news or a feed item }
                - required: [url]
                  properties:
                    url: { type: string, minLength: 1 }
                - required: [text]
                  properties:
                    text: { type: string, minLength: 1 }
              description: Supply news_id, a URL or article text. news_id takes precedence; a nonempty URL is fetched when news_id is absent.
              properties:
                company_id: { type: string, example: U_9250 }
                role: { type: string, enum: [owner, ceo, cfo, treasurer, accountant], default: ceo }
                news_id: { type: string }
                url: { type: string, description: Empty or a public HTTP(S) URL; at most 4096 UTF-8 bytes. }
                title: { type: string, description: At most 1000 UTF-8 bytes. }
                text: { type: string, description: At most 30000 UTF-8 bytes. }
                published_time: { type: string }
                source_name: { type: string }
      responses:
        '200': { description: 'Evidence-linked analysis; generation.method indicates LLM or deterministic fallback. Each claim has evidence_ids and uses_bank_material; interpretation.bank_position is null unless a bank material states a view, and interpretation.bank_materials_used[{id, title, page}] names the Alfa-Bank materials the conclusions rest on.' }
        '400': { description: Invalid JSON, missing or empty article, or invalid company identifier }
        '401': { description: Missing or invalid API token when configured }
        '413': { description: Article or metadata exceeds a UTF-8 byte limit }
        '404': { description: Company or news_id not found }
        '422': { description: News URL could not be parsed }
  /api/v1/insights/{insight_id}/questions:
    post:
      summary: Ask a follow-up question about an in-memory insight
      parameters:
        - in: path
          name: insight_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provide question, lens, or both.
              properties:
                question: { type: string, description: At most 2000 UTF-8 bytes. }
                lens: { type: string, enum: [risks, counterparties, treasury, scenarios, sources] }
      responses:
        '200': { description: Answer with source references }
        '400': { description: Empty question, invalid JSON, or invalid insight identifier }
        '401': { description: Missing or invalid API token when configured }
        '413': { description: Question exceeds 2000 UTF-8 bytes }
        '404': { description: Insight not found in current process }
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    HeaderToken:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    CompanyId:
      in: path
      name: company_id
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
